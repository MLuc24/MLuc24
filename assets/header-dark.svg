<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 326" width="880" height="326" role="img" aria-label="Pham Manh Luc, web developer in Vietnam. Open data for Arena of Valor: 129 heroes, 112 items, 88 arcana.">
  <style>
    .kicker { font: 500 11px ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; letter-spacing: 0.16em; }
    .lede { font: 400 45px Georgia, 'Iowan Old Style', 'Noto Serif', 'Times New Roman', serif; letter-spacing: -0.015em; }
    .num { font: 600 21px ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
    .unit { font: 500 10px ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; letter-spacing: 0.14em; }
